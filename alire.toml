name = "espidf_wear_levelling"
version = "0.1.0-dev"
website = "https://github.com/godunko/espidf_wear_levelling"
description = "A0B: Ada/ESP-IDF: Wear Levelling API bindings"
long-description = """
Ada bindings for the ESP-IDF `esp_wear_levelling` component, providing wear leveling support over raw flash partitions on ESP32 microcontrollers.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["a0b", "embedded", "esp", "esp32", "espidf"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
espidf_partition = "*"
